name: repo-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'skills/**'
      - 'scripts/**'
      - 'schema/**'
      - 'tools/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
      - 'llms.txt'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doc dependencies
        # 本仓没有 requirements.txt（脚本是 jsx/py 单文件）：显式装文档检查依赖。
        run: python -m pip install "PyYAML>=6.0" "markdown-it-py>=3.0" "jsonschema>=4.20"
      - name: Invariants
        # 没有 sources.json，不需要 --changed-since / 同 PR co-change。
        run: python tools/repo-kit/check_repo.py --root .
      - name: Generated artifacts are up to date
        run: python tools/repo-kit/generate.py --root . --check
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
